# Extra compose file for MED-354 spike. Does not edit docker-compose.dev.yml.
# Start with:
#   docker compose -p mediajira-v2 -f docker-compose.dev.yml -f variations-studio-api/compose.dev.yml up -d --build variations-studio-api
#
# Stop host `npm run dev` on 3010 first, or the port publish will fail.

services:
  variations-studio-api:
    build:
      context: ./variations-studio-api
      dockerfile: Dockerfile.dev
    container_name: variations-studio-api-dev
    restart: always
    ports:
      - "3010:3010"
    env_file:
      - .env
    volumes:
      - ./variations-studio-api:/app
      - variations_studio_node_modules:/app/node_modules
      - variations_studio_next:/app/.next
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3010
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - BROWSERLESS_API_KEY=${BROWSERLESS_API_KEY}
      - BROWSERLESS_BASE=${BROWSERLESS_BASE:-https://chrome.browserless.io}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3010/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=variations-studio-api"

volumes:
  variations_studio_node_modules:
  variations_studio_next:
