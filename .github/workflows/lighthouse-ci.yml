# Lighthouse CI — push/PR to `lighthouse-ci-test`.
# Secrets required: LHCI_AUTH_EMAIL, LHCI_AUTH_PASSWORD (Settings → Secrets → Actions).
# See frontend/LIGHTHOUSE_README.md for full setup and design notes.
name: Lighthouse CI

on:
  push:
    branches: [main, prod-preview]
  pull_request:
    branches: [main, prod-preview]

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Force all JS actions onto the Node 24 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # packages: write so the image builds below can export their layer cache to
    # GHCR instead of the GitHub Actions cache (MED-322).
    permissions:
      contents: read
      packages: write
    env:
      # https://docs.docker.com/build/ci/github-actions/build-summary/#disable-job-summary
      DOCKER_BUILD_SUMMARY: false
    steps:
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Branch names contain characters that are illegal in a Docker tag ("/"
      # most of all), so derive a tag-safe scope. Read the ref through env
      # rather than interpolating it into the script, since a branch name is
      # attacker-controlled text.
      - name: Compute cache scope
        env:
          RAW_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          SCOPE=$(printf '%s' "$RAW_REF" | tr -c 'a-zA-Z0-9_.-' '-' | cut -c1-100)
          echo "CACHE_SCOPE=$SCOPE" >> "$GITHUB_ENV"
          echo "Buildx cache scope: $SCOPE"

      # MED-322: these builds used cache-from/to: type=gha, whose mode=max blobs
      # were consuming the repo's entire 10 GB Actions cache quota (10.27 GB
      # across 84 entries, i.e. permanently evicting). GHCR storage is free and
      # unlimited for public repos and does not count against that quota, so the
      # layer cache lives there and the Actions cache is left for npm/pip/
      # Playwright. Writes are scoped per branch so branches stop overwriting
      # each other's cache; reads fall back to the trunk branches.
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          tags: mediajira-backend:${{ github.sha }}
          load: true
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}/backend:lhcache-${{ env.CACHE_SCOPE }}
            type=registry,ref=ghcr.io/${{ github.repository }}/backend:lhcache-prod-preview
            type=registry,ref=ghcr.io/${{ github.repository }}/backend:lhcache-main
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/backend:lhcache-${{ env.CACHE_SCOPE }},mode=max,ignore-error=true

      # The runner ran out of disk exporting the frontend image ("no space left
      # on device"); free buildx storage between the two image builds (mirrors
      # the main pipeline's pre-frontend-build prune).
      - name: Free disk space before frontend build
        run: docker buildx prune -af --keep-storage 2GB

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          tags: mediajira-frontend:${{ github.sha }}
          load: true
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}/frontend:lhcache-${{ env.CACHE_SCOPE }}
            type=registry,ref=ghcr.io/${{ github.repository }}/frontend:lhcache-prod-preview
            type=registry,ref=ghcr.io/${{ github.repository }}/frontend:lhcache-main
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/frontend:lhcache-${{ env.CACHE_SCOPE }},mode=max,ignore-error=true

      - name: Create CI environment file
        run: |
          cat > .env << EOF
          SECRET_KEY=test-secret-key-for-ci-${{ github.sha }}
          ORGANIZATION_ACCESS_TOKEN_SECRET_KEY=test-org-token-key-for-ci-${{ github.sha }}
          ORGANIZATION_ACCESS_TOKEN_ENCRYPTION_KEY=$(python3 -c "import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          POSTGRES_DB=mediajira_test_db
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=test_password
          POSTGRES_PORT=5432
          DB_HOST=db
          API_BASE_URL=http://nginx
          DEBUG=False
          ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/0
          CLAMAV_HOST=clamav
          CLAMAV_PORT=3310
          OTEL_SDK_DISABLED=true
          OTEL_TRACES_EXPORTER=none
          OTEL_METRICS_EXPORTER=none
          OTEL_LOGS_EXPORTER=none
          EOF

      - name: Start all services
        run: docker compose --profile ci --env-file .env up -d

      - name: Wait for database, Redis and ClamAV
        run: |
          echo "Waiting for database..."
          timeout=180
          counter=0
          while [ $counter -lt $timeout ]; do
            if docker compose --profile ci exec -T db pg_isready -U postgres > /dev/null 2>&1; then
              echo "Database ready."
              break
            fi
            sleep 2
            counter=$((counter + 2))
          done
          if [ $counter -eq $timeout ]; then
            docker compose --profile ci logs db
            exit 1
          fi

          echo "Waiting for Redis..."
          redis_timeout=30
          redis_counter=0
          while [ $redis_counter -lt $redis_timeout ]; do
            if docker compose --profile ci exec -T redis redis-cli ping > /dev/null 2>&1; then
              echo "Redis ready."
              break
            fi
            sleep 1
            redis_counter=$((redis_counter + 1))
          done
          if [ $redis_counter -eq $redis_timeout ]; then
            docker compose --profile ci logs redis
            exit 1
          fi

          echo "Waiting for ClamAV..."
          clamav_timeout=60
          clamav_counter=0
          while [ $clamav_counter -lt $clamav_timeout ]; do
            if docker compose --profile ci exec -T clamav clamdscan --version > /dev/null 2>&1; then
              echo "ClamAV ready."
              break
            fi
            sleep 2
            clamav_counter=$((clamav_counter + 2))
          done
          if [ $clamav_counter -eq $clamav_timeout ]; then
            docker compose --profile ci logs clamav
            exit 1
          fi

      # Run without --settings=backend.ci_settings — see LIGHTHOUSE_README.md § CI design decisions.
      - name: Run migrations (Postgres)
        run: |
          docker compose exec backend sh -c "
            python manage.py makemigrations --noinput &&
            python manage.py makemigrations --merge --noinput &&
            python manage.py migrate --noinput
          "

      # Plans (Free/Team) are seeded by migration 0004_seed_token_plans during the
      # migrate step above; initialize_default_plans() was removed in the SMP-560
      # token-billing redesign, so the old explicit seed step is gone.

      - name: Verify backend is ready
        run: |
          for i in $(seq 1 30); do
            if docker compose --profile ci exec -T backend python manage.py shell -c "from django.contrib.auth.models import User; print('DB OK')" > /dev/null 2>&1; then
              echo "Backend ready."
              exit 0
            fi
            sleep 2
          done
          docker compose --profile ci logs backend --tail 100
          exit 1

      - name: Wait for app on localhost
        run: |
          for i in $(seq 1 90); do
            if curl -fsS --max-time 5 http://localhost/ > /dev/null 2>&1; then
              echo "OK"
              exit 0
            fi
            sleep 2
          done
          docker compose --profile ci logs nginx --tail 80 || true
          docker compose --profile ci logs frontend --tail 80 || true
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # MED-322: skip npm ci on an exact node_modules hit. Same key as
      # mediajira-ci.yml / chromatic.yml. See code_scan for why ~/.npm is not enough.
      - name: Cache frontend node_modules
        id: frontend-node-modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.frontend-node-modules.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci

      - name: Run Lighthouse
        working-directory: frontend
        env:
          LHCI_AUTH_EMAIL: ${{ secrets.LHCI_AUTH_EMAIL }}
          LHCI_AUTH_PASSWORD: ${{ secrets.LHCI_AUTH_PASSWORD }}
          CI: true
        run: npm run lighthouse:local

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports-${{ github.sha }}
          path: frontend/.lighthouseci/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Docker compose logs (on failure)
        if: failure()
        run: |
          docker compose --profile ci ps -a || true
          docker compose --profile ci logs backend --tail 250 || true
          docker compose --profile ci logs nginx --tail 120 || true

      - name: Cleanup containers
        if: always()
        run: |
          docker compose --profile ci down -v || true
          docker system prune -f || true
