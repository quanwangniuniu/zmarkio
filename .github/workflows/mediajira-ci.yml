name: MediaJira CI/CD Pipeline

on:
  push:
    branches: [main, prod-preview, feature/MED-447]
    tags:
      - 'v*'
  pull_request:
    branches: [main, prod-preview]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Image names follow <project>-<service>, which build_images tags to match.
env:
  COMPOSE_PROJECT_NAME: mediajira

jobs:
  block:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR rules
        if: github.event_name == 'pull_request'
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          
          echo "PR from: $HEAD_REF to: $BASE_REF"
          
          if [ "$BASE_REF" == "main" ]; then
            # Main branch only accepts PRs from prod-preview
            if [ "$HEAD_REF" != "prod-preview" ]; then
              echo "❌ Only prod-preview branch can open PRs to main. Current source branch: $HEAD_REF"
              exit 1
            fi
            echo "✅ Source branch $HEAD_REF is allowed to PR to main."
          elif [ "$BASE_REF" == "prod-preview" ]; then
            # Prod-preview branch accepts PRs from any branch except itself
            if [ "$HEAD_REF" == "prod-preview" ]; then
              echo "❌ prod-preview branch cannot open PRs to itself. Please use a different source branch."
              exit 1
            fi
            echo "✅ Source branch $HEAD_REF is allowed to PR to prod-preview."
          fi
      
      - name: Skip check for push events
        if: github.event_name == 'push'
        run: |
          echo "✅ Push event - skipping PR branch check"

  code_scan:
    needs: block
    if: always() && needs.block.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Setup Node 
        uses: actions/setup-node@v4 
        with: 
          node-version: '20'
      # Install dependencies using npm ci
      # npm ci is strict:
      # - Fails if package-lock.json and package.json are out of sync
      # - Fails if dependencies are missing
      # - Ensures reproducible builds
      - name: Install dependencies (strict mode)
        run: |
          cd frontend
          npm ci || (echo "npm ci failed, retrying once (e.g. esbuild ETXTBSY)..." && rm -rf node_modules && sleep 2 && npm ci)
      # Install depcheck globally
      # depcheck detects:
      # - Missing dependencies (used in code but not in package.json)
      # - Unused dependencies (installed but not used)
      - name: Install depcheck
        run: cd frontend && npm install -g depcheck
      # depcheck to detect missing dependencies
      - name: Run depcheck
        run: |
          cd frontend
          depcheck
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install scan tools
        run: |
          pip install bandit pip-audit
          sudo apt install gitleaks

      - name: Run Bandit scan
        continue-on-error: true
        run: |
          mkdir -p devops/bandit
          bandit -r backend -c devops/bandit/bandit.yaml -f html -o devops/bandit/bandit-report.html --severity-level medium

          SEVERITY=$(grep -c Severity devops/bandit/bandit-report.html || true)
          if [ $SEVERITY -gt 0 ]; then
            echo "Bandit found $SEVERITY medium/high severity issues."
          fi
          
      - name: Run pip-audit and npm audit scan
        continue-on-error: true
        run: |
          mkdir -p devops/{pip-audit,npm-audit}
          pip-audit -r backend/requirements.txt -f json -o devops/pip-audit/pip-audit-report-raw.json || echo "pip-audit failed"
          cat devops/pip-audit/pip-audit-report-raw.json | python -m json.tool > devops/pip-audit/pip-audit-report.json || echo "json formatting failed"
          npm audit --prefix frontend --json > devops/npm-audit/npm-audit-report.json || echo "npm audit failed"

      - name: Run gitleaks scan
        continue-on-error: true
        run: |      
          mkdir -p devops/gitleaks
          rm -rf frontend/{node_modules,.next}
          gitleaks detect --config devops/gitleaks/.gitleaks.toml --source . --report-path devops/gitleaks/gitleaks-report.json --no-git || echo "gitleaks failed"

      - name: Check Dockerfile for USER directive
        run: |
          if ! grep "^USER" backend/Dockerfile; then
            echo "backend Dockerfile missing USER directive"
            exit 1
          fi
          if ! grep "^USER" frontend/Dockerfile; then
            echo "frontend Dockerfile missing USER directive"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7 

      - name: Terraform check
        run: |
          cd devops/infra/terraform
          terraform init -backend=false
          terraform fmt -check -recursive
          terraform validate

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with: 
          name: code-scan-reports-${{ github.sha }}
          path: |
            devops/bandit/*report*
            devops/pip-audit/*report*
            devops/npm-audit/*report*
            devops/gitleaks/*report*
  migration_guard:
    needs: block
    if: always() && needs.block.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard against deleting historical migrations
        run: |
          set -euo pipefail

          if [ "${{ contains(github.event.pull_request.labels.*.name, 'migration-override') }}" = "true" ]; then
            echo "Override label 'migration-override' detected; skipping migration deletion guard."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No stable base SHA available; skipping migration deletion guard."
            exit 0
          fi

          deleted_migrations=$(git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- 'backend/**/migrations/*.py' | awk '$1 ~ /^(D|R)/ { print }')

          if [ -n "$deleted_migrations" ]; then
            echo "Django migration files were deleted or renamed:"
            echo "$deleted_migrations"
            echo
            echo "Historical migration files must be kept for existing databases."
            echo "Add merge/squash migrations instead of deleting old migration files."
            echo "See backend/MIGRATIONS.md for the migration policy (why, and how to change migrations)."
            exit 1
          fi

          echo "No deleted or renamed Django migration files detected."

  # Builds the backend, frontend and database images once per run and hands
  # them to image_scan and every test job as artifacts (MED-447). Before this,
  # application_test, image_scan and Lighthouse each built them, and docker
  # compose rebuilt them once more inside application_test.
  build_images:
    needs: block
    if: always() && needs.block.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tagged with the names docker compose derives from COMPOSE_PROJECT_NAME,
      # so `docker compose up --no-build` uses these images directly.
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          tags: mediajira-backend:latest
          load: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/backend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/backend:cache,mode=max

      - name: Free disk space before frontend build
        run: docker buildx prune -af --keep-storage 2GB

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          tags: mediajira-frontend:latest
          load: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/frontend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/frontend:cache,mode=max

      - name: Build database images
        run: |
          # compose needs the env_file to exist to parse docker-compose.yml
          touch .env
          docker compose --profile ci build db pgbackrest

      - name: Export images
        run: |
          mkdir -p "$RUNNER_TEMP/ci-images"
          docker save mediajira-backend | zstd -T0 -3 -o "$RUNNER_TEMP/ci-images/backend.tar.zst"
          docker save mediajira-frontend | zstd -T0 -3 -o "$RUNNER_TEMP/ci-images/frontend.tar.zst"
          docker save mediajira-db mediajira-pgbackrest | zstd -T0 -3 -o "$RUNNER_TEMP/ci-images/db.tar.zst"
          ls -lh "$RUNNER_TEMP/ci-images"

      - name: Upload backend image
        uses: actions/upload-artifact@v4
        with:
          name: ci-image-backend
          path: ${{ runner.temp }}/ci-images/backend.tar.zst
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: Upload frontend image
        uses: actions/upload-artifact@v4
        with:
          name: ci-image-frontend
          path: ${{ runner.temp }}/ci-images/frontend.tar.zst
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: Upload database images
        uses: actions/upload-artifact@v4
        with:
          name: ci-image-db
          path: ${{ runner.temp }}/ci-images/db.tar.zst
          compression-level: 0
          retention-days: 1
          overwrite: true

  image_scan:
    needs: build_images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load CI images
        uses: ./.github/actions/load-ci-images
        with:
          images: backend frontend

      # Install Trivy
      - name: Install Trivy
        continue-on-error: true
        run: |
          TRIVY_VERSION=$(curl -s https://api.github.com/repos/aquasecurity/trivy/releases/latest | grep -Po '"tag_name": "v\K[0-9.]+' )
          wget https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz
          tar -xzf trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz
          sudo mv trivy /usr/local/bin/
          trivy --version

      # Run Trivy scan for backend image
      - name: Run Trivy scan (backend)
        continue-on-error: true
        run: |
          mkdir -p devops/trivy
          trivy image --exit-code 0 --severity HIGH,CRITICAL --format json -o devops/trivy/trivy-backend-report.json mediajira-backend:latest


      # Run Trivy scan for frontend image
      - name: Run Trivy scan (frontend)
        continue-on-error: true
        run: |
          trivy image --exit-code 0 --severity HIGH,CRITICAL --format json -o devops/trivy/trivy-frontend-report.json mediajira-frontend:latest

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-reports-${{ github.sha }}
          path: |
            devops/trivy/*report*

  # The backend suite is split into 4 shards by module (see the
  # pytest_collection_modifyitems hook in backend/conftest.py). Shards skip the
  # coverage gate; backend_coverage combines their data and enforces it.
  backend_tests:
    name: backend_tests (shard ${{ matrix.shard }})
    needs: build_images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load CI images
        uses: ./.github/actions/load-ci-images
        with:
          images: backend db
      - name: Start CI stack
        uses: ./.github/actions/start-ci-stack
        with:
          services: db redis clamav backend

      - name: Run migration checks and backend tests (Postgres)
        run: |
          docker compose exec backend sh -c "
            echo 'Checking for missing migrations...' &&
            python manage.py makemigrations --check --dry-run --settings=backend.ci_settings &&
            echo 'Applying migrations...' &&
            python manage.py migrate --noinput --settings=backend.ci_settings
          "

      # Run backend tests in containerized environment
      - name: Run backend tests in containerized environment (shard ${{ matrix.shard }})
        # continue-on-error: true
        run: |
          # run tests in the built backend image
          docker compose exec -e PYTEST_SHARD_INDEX=${{ matrix.shard }} -e PYTEST_SHARD_COUNT=4 backend sh -c "
            echo 'Running migrations...' &&
            python manage.py makemigrations core&&
            python manage.py migrate core&&
            python manage.py makemigrations access_control&&
            python manage.py migrate access_control&&
          # python manage.py makemigrations authentication&&
          # python manage.py migrate authentication&&
            python manage.py makemigrations teams&&
            python manage.py migrate teams&&
            python manage.py makemigrations user_preferences&&
            python manage.py migrate user_preferences&&
            echo 'Running pytest tests...' &&
            pytest -v -n logical --cov-fail-under=0
           "

      - name: Export coverage data
        run: |
          mkdir -p coverage-data
          docker compose cp backend:/app/.coverage coverage-data/.coverage.shard-${{ matrix.shard }}

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-shard-${{ matrix.shard }}
          path: coverage-data/
          include-hidden-files: true
          retention-days: 1
          overwrite: true

      # Cleanup containers and volumes
      - name: Cleanup containers
        if: always()
        run: |
          echo "Cleaning up containers and volumes..."
          # A prior step may have failed before the ".env" file was created.
          # docker compose still needs it to resolve the "env_file" directive,
          # and this cleanup must never fail the job, so guard both.
          [ -f .env ] || touch .env
          docker compose --profile ci --env-file .env down -v || true
          echo "Cleaning up unused Docker resources..."
          docker system prune -f || true

  backend_coverage:
    needs: [build_images, backend_tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load CI images
        uses: ./.github/actions/load-ci-images
        with:
          images: backend

      - name: Download shard coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: backend-coverage-shard-*
          path: coverage-data
          merge-multiple: true

      - name: Combine coverage and enforce the gate
        run: |
          count=$(ls coverage-data/.coverage.shard-* 2>/dev/null | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "Expected coverage data from 4 shards, found $count"
            exit 1
          fi
          docker run --rm -v "$PWD/coverage-data:/coverage-data:ro" --entrypoint sh mediajira-backend -c '
            set -e
            cd /app
            cp /coverage-data/.coverage.shard-* .
            coverage combine
            coverage report --fail-under=85
          '

  backend_serial_tests:
    needs: build_images
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load CI images
        uses: ./.github/actions/load-ci-images
        with:
          images: backend db
      - name: Start CI stack
        uses: ./.github/actions/start-ci-stack
        with:
          services: db redis clamav backend

      - name: Run migration checks and backend tests (Postgres)
        run: |
          docker compose exec backend sh -c "
            echo 'Checking for missing migrations...' &&
            python manage.py makemigrations --check --dry-run --settings=backend.ci_settings &&
            echo 'Applying migrations...' &&
            python manage.py migrate --noinput --settings=backend.ci_settings
          "

      # Every collected test must belong to exactly one backend_tests shard.
      # Collection needs the database, so this runs here rather than in
      # backend_coverage.
      - name: Check shards cover the whole suite
        run: |
          docker compose exec -T backend sh -c '
            set -e
            collect() { pytest --collect-only -qq -n 0 --no-cov -p no:cacheprovider | grep "::" | sort; }
            collect > /tmp/all.txt
            for i in 0 1 2 3; do
              PYTEST_SHARD_INDEX=$i PYTEST_SHARD_COUNT=4 collect > /tmp/shard-$i.txt
              echo "shard $i: $(wc -l < /tmp/shard-$i.txt) tests"
            done
            sort /tmp/shard-*.txt > /tmp/union.txt
            echo "full suite: $(wc -l < /tmp/all.txt) tests"
            if [ ! -s /tmp/all.txt ]; then echo "No tests collected"; exit 1; fi
            if [ -n "$(uniq -d /tmp/union.txt)" ]; then echo "Tests collected by more than one shard:"; uniq -d /tmp/union.txt; exit 1; fi
            if ! cmp -s /tmp/all.txt /tmp/union.txt; then echo "Shards do not match the full suite:"; diff /tmp/all.txt /tmp/union.txt; exit 1; fi
            echo "Shards partition the full suite."
          '

      # Run tests that are excluded from the parallel run above.
      # These file-upload integration tests, asset scan Celery tasks, and budget
      # concurrency tests share resources / race on timing and are not safe under
      # xdist, so the parallel run --ignores them (see backend/pytest.ini). They
      # were part of the suite before SMP-555 (executed by `manage.py test`), so
      # we run them serially here to avoid a coverage regression.
      - name: Run serial backend tests (excluded from parallel run)
        run: |
          docker compose exec backend sh -c "
            echo 'Running serial backend tests...' &&
            pytest -v -o addopts='' --ds=backend.settings --timeout=600 metric_upload/tests/integration asset/tests/test_tasks.py budget_approval/tests/test_concurrency.py
           "

      # Cleanup containers and volumes
      - name: Cleanup containers
        if: always()
        run: |
          echo "Cleaning up containers and volumes..."
          # A prior step may have failed before the ".env" file was created.
          # docker compose still needs it to resolve the "env_file" directive,
          # and this cleanup must never fail the job, so guard both.
          [ -f .env ] || touch .env
          docker compose --profile ci --env-file .env down -v || true
          echo "Cleaning up unused Docker resources..."
          docker system prune -f || true

  frontend_tests:
    needs: build_images
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load CI images
        uses: ./.github/actions/load-ci-images
        with:
          images: frontend

      # Run frontend tests in container
      - name: Run frontend tests in container
        run: |
          # run tests in the built frontend image; they need no backend services
          docker run --rm --entrypoint sh mediajira-frontend -c "
            echo 'Running frontend linting...' &&
            npx next lint --max-warnings 9999 &&
            echo 'Building frontend application...' &&
            npm run build &&
            echo 'Running frontend tests...' &&
            npm test
          "

  studio_tests:
    needs: build_images
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load CI images
        uses: ./.github/actions/load-ci-images
        with:
          images: backend db
      - name: Start CI stack
        uses: ./.github/actions/start-ci-stack
        with:
          services: db redis clamav backend

      - name: Run migration checks and backend tests (Postgres)
        run: |
          docker compose exec backend sh -c "
            echo 'Checking for missing migrations...' &&
            python manage.py makemigrations --check --dry-run --settings=backend.ci_settings &&
            echo 'Applying migrations...' &&
            python manage.py migrate --noinput --settings=backend.ci_settings
          "

      # The Studio service is a separate Next.js app that talks to the same
      # Postgres. Its tests need one org whose tenant schema exists, because
      # core_project / core_projectmember are per-org tables.
      # Studio tests need an org tenant schema. AdCopyVariation is tenant-scoped
      # and FKs to public.meta_ad_creatives, so public migrations (incl. meta_ads)
      # must be applied before Organization.save() → provision_tenant_schema().
      - name: Provision a tenant schema for variations-studio tests
        run: |
          docker compose exec -T backend sh <<'EOS'
          set -e
          python manage.py migrate --noinput
          python manage.py shell <<'PY'
          from django.db.models.signals import post_save
          from core.models import Organization
          from core.services.tenant import provision_tenant_schema
          from stripe_meta.signals import create_default_subscription

          post_save.disconnect(create_default_subscription, sender=Organization)
          try:
              for slug, name in (
                  ('ci-studio-org', 'CI Studio Org'),
                  # Second org enables dual-tenant routing Jest coverage.
                  ('ci-studio-org-b', 'CI Studio Org B'),
              ):
                  org, created = Organization.objects.get_or_create(
                      slug=slug,
                      defaults={'name': name, 'is_active': True},
                  )
                  if not created:
                      provision_tenant_schema(org.slug)
                  print('tenant schema ready for', org.slug)
          finally:
              post_save.connect(create_default_subscription, sender=Organization)
          PY
          EOS

      - name: Mint Django JWT fixtures for studio auth parity
        run: |
          set -e
          docker compose exec -T backend python manage.py issue_studio_jwt_fixtures \
            --org-slug=ci-studio-org \
            > /tmp/django-jwt-fixtures.json
          python3 -c "
          import json
          data = json.load(open('/tmp/django-jwt-fixtures.json'))
          assert data.get('access_token'), 'missing access_token'
          assert data.get('django_accepts_access') is True
          print('django jwt fixtures ready for user_id=', data.get('user_id'))
          "

      - name: Run variations-studio tests
        run: |
          set -a; . ./.env; set +a
          docker run --rm --network host \
            -v "$PWD/variations-studio-api:/app" \
            -v "/tmp/django-jwt-fixtures.json:/fixtures/django-jwt-fixtures.json:ro" \
            -w /app \
            -e DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT}/${POSTGRES_DB}" \
            -e SECRET_KEY="${SECRET_KEY}" \
            -e DJANGO_JWT_FIXTURES_PATH=/fixtures/django-jwt-fixtures.json \
            node:20-alpine sh -c "
              npm ci &&
              npx prisma generate &&
              npx tsc --noEmit &&
              npm test
            "

      # Cleanup containers and volumes
      - name: Cleanup containers
        if: always()
        run: |
          echo "Cleaning up containers and volumes..."
          # A prior step may have failed before the ".env" file was created.
          # docker compose still needs it to resolve the "env_file" directive,
          # and this cleanup must never fail the job, so guard both.
          [ -f .env ] || touch .env
          docker compose --profile ci --env-file .env down -v || true
          echo "Cleaning up unused Docker resources..."
          docker system prune -f || true

  budget_e2e:
    needs: build_images
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load CI images
        uses: ./.github/actions/load-ci-images
        with:
          images: backend frontend db
      - name: Start CI stack
        uses: ./.github/actions/start-ci-stack
        with:
          extra-env: |
            FRONTEND_CLEAR_NEXT=1

      - name: Run migration checks and backend tests (Postgres)
        run: |
          docker compose exec backend sh -c "
            echo 'Checking for missing migrations...' &&
            python manage.py makemigrations --check --dry-run --settings=backend.ci_settings &&
            echo 'Applying migrations...' &&
            python manage.py migrate --noinput --settings=backend.ci_settings
          "

      # The ci_settings migrate above applies nothing (settings.py sets __all__,
      # so `from .settings import *` brings in no INSTALLED_APPS). The single-job
      # pipeline only got a migrated database from the studio step's plain
      # migrate, so apply migrations explicitly here.
      - name: Apply migrations for budget E2E
        run: docker compose exec -T backend python manage.py migrate --noinput

      # Budget approval Playwright E2E (MED-315): real backend via nginx, isolated fixtures per test.
      # Reload next start before E2E so HTML and runtime chunks agree (kept from
      # the single-job pipeline, where a verification build replaced .next).
      - name: Restart frontend after verification build
        run: docker compose restart frontend

      - name: Wait for nginx (budget E2E)
        run: |
          echo "Waiting for nginx to serve the stack..."
          timeout=120
          counter=0
          while [ $counter -lt $timeout ]; do
            if curl --max-time 5 -fsS http://localhost/health > /dev/null 2>&1 && \
               curl --max-time 5 -fsS http://localhost/login > /dev/null 2>&1; then
              echo "nginx is ready!"
              exit 0
            fi
            echo "nginx not ready yet, waiting... ($counter/$timeout)"
            sleep 2
            counter=$((counter + 2))
          done
          echo "nginx failed to become healthy within ${timeout}s"
          docker compose logs nginx
          exit 1

      - name: Provision budget E2E anchor user
        run: |
          docker compose exec -T backend sh <<'EOS'
          set -e
          python manage.py shell <<'PY'
          from django.contrib.auth import get_user_model
          from django.db.models.signals import post_save

          from core.models import Organization, OrganizationMembership, Project, ProjectMember
          from core.services.tenant import provision_tenant_schema, slug_to_schema_name
          from core.tenant_context import tenant_schema_context
          from stripe_meta.signals import create_default_subscription

          User = get_user_model()
          ANCHOR_EMAIL = "ci-budget-anchor@example.com"
          ORG_SLUG = "ci-budget-e2e-org"

          post_save.disconnect(create_default_subscription, sender=Organization)
          try:
              org, _ = Organization.objects.get_or_create(
                  slug=ORG_SLUG,
                  defaults={"name": "CI Budget E2E Org", "is_active": True},
              )
              # MED-327: apiAuthHeaders re-logs in on every API call, so the
              # requester accumulates many sessions across 6 sequential tests.
              # Set a high cap so eviction never blacklists the browser token.
              org.max_concurrent_sessions = 100
              org.save(update_fields=["max_concurrent_sessions", "updated_at"])
              provision_tenant_schema(org.slug)

              anchor, _ = User.objects.get_or_create(
                  email=ANCHOR_EMAIL,
                  defaults={
                      "username": "ci-budget-anchor",
                      "organization": org,
                      "current_organization": org,
                      "is_verified": True,
                      "password_set": True,
                  },
              )
              anchor.organization = org
              anchor.current_organization = org
              anchor.is_verified = True
              anchor.password_set = True
              anchor.set_password("password123!")
              anchor.save()

              OrganizationMembership.objects.update_or_create(
                  user=anchor,
                  organization=org,
                  defaults={"role": "admin", "is_active": True},
              )

              schema = slug_to_schema_name(org.slug)
              with tenant_schema_context(schema):
                  project, _ = Project.objects.get_or_create(
                      organization=org,
                      name="CI Budget Anchor Project",
                      defaults={"owner": anchor},
                  )
                  ProjectMember.objects.update_or_create(
                      user=anchor,
                      project=project,
                      defaults={"role": "owner", "is_active": True},
                  )
              anchor.active_project = project
              anchor.save(update_fields=["active_project"])
              print("budget E2E anchor ready:", anchor.email, "project_id=", project.id)
          finally:
              post_save.connect(create_default_subscription, sender=Organization)
          PY
          EOS

      - name: Generate budget E2E fixtures
        run: |
          set -e
          mkdir -p frontend/e2e/budget/fixtures
          docker compose exec -T backend python manage.py issue_budget_e2e_fixtures \
            --allow-outside-debug \
            --anchor-email=ci-budget-anchor@example.com \
            > frontend/e2e/budget/fixtures/budget-e2e-fixtures.json
          python3 -c "
          import json
          data = json.load(open('frontend/e2e/budget/fixtures/budget-e2e-fixtures.json'))
          assert data.get('users', {}).get('requester', {}).get('access_token'), 'missing requester access_token'
          print('budget E2E fixtures ready for org', data.get('organization_slug'))
          "

      - name: Set up Node for budget Playwright E2E
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright (Chromium only)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Restart frontend with a clean Next cache for budget E2E
        run: |
          docker compose restart frontend

          echo "Waiting for frontend to rebuild after clearing .next..."
          timeout=180
          counter=0
          while [ $counter -lt $timeout ]; do
            if curl -fsS http://localhost/tasks > /dev/null 2>&1; then
              echo "frontend is ready!"
              exit 0
            fi
            echo "frontend not ready yet, waiting... ($counter/$timeout)"
            sleep 3
            counter=$((counter + 3))
          done

          echo "frontend failed to become ready within ${timeout}s"
          docker compose logs frontend
          exit 1

      # The restarts above only wait for HTML. This also fetches every Next.js
      # chunk the login page references, so a stale build fails here with a
      # clear message instead of as a Playwright timeout. It runs after the last
      # restart so it checks the same server the E2E run talks to.
      - name: Verify frontend browser assets (budget E2E)
        run: |
          if ! python3 - <<'PY'
          import time
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlsplit
          from urllib.request import urlopen

          base_url = "http://localhost"
          deadline = time.monotonic() + 120

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = set()

              def handle_starttag(self, tag, attrs):
                  src = dict(attrs).get("src")
                  if tag == "script" and src:
                      url = urljoin(base_url, src)
                      parsed = urlsplit(url)
                      if ((parsed.scheme, parsed.netloc)
                              == (urlsplit(base_url).scheme, urlsplit(base_url).netloc)
                              and parsed.path.startswith("/_next/static/")
                              and parsed.path.endswith(".js")):
                          self.urls.add(url)

          def fetch(url, expected_type):
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise TimeoutError("Frontend readiness deadline exceeded")
              with urlopen(url, timeout=min(10, remaining)) as response:
                  content_type = response.headers.get("Content-Type", "")
                  if expected_type not in content_type:
                      raise ValueError(f"{url}: unexpected Content-Type {content_type}")
                  body = response.read()
                  if not body:
                      raise ValueError(f"{url}: empty response")
                  return body

          while time.monotonic() < deadline:
              try:
                  page = Scripts()
                  page.feed(fetch(f"{base_url}/login", "text/html").decode("utf-8"))
                  if not page.urls:
                      raise ValueError("Login page contains no Next.js script assets")
                  for url in sorted(page.urls):
                      fetch(url, "javascript")
                  print(f"Frontend ready: login page and {len(page.urls)} scripts loaded.")
                  break
              except (OSError, ValueError) as exc:
                  print(f"Frontend not ready: {exc}", flush=True)
                  time.sleep(min(2, max(0, deadline - time.monotonic())))
          else:
              raise SystemExit("Frontend page/assets did not become ready within 120s")
          PY
          then
            docker compose logs --tail=100 frontend nginx
            exit 1
          fi

      - name: Run budget approval Playwright E2E
        working-directory: frontend
        env:
          CI: true
          BASE_URL: http://localhost
          E2E_USE_EXISTING_SERVER: "1"
        run: npm run test:e2e:budget

      - name: Upload budget E2E Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budget-e2e-playwright-${{ github.sha }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

      # Cleanup containers and volumes
      - name: Cleanup containers
        if: always()
        run: |
          echo "Cleaning up containers and volumes..."
          # A prior step may have failed before the ".env" file was created.
          # docker compose still needs it to resolve the "env_file" directive,
          # and this cleanup must never fail the job, so guard both.
          [ -f .env ] || touch .env
          docker compose --profile ci --env-file .env down -v || true
          echo "Cleaning up unused Docker resources..."
          docker system prune -f || true

  # Moved here from the separate Lighthouse CI workflow so it reuses the images
  # from build_images instead of building its own (MED-447).
  lighthouse:
    needs: build_images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Force all JS actions onto the Node 24 runtime.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load CI images
        uses: ./.github/actions/load-ci-images
        with:
          images: backend frontend db
      - name: Start CI stack
        uses: ./.github/actions/start-ci-stack
        with:
          extra-env: |
            OTEL_SDK_DISABLED=true
            OTEL_TRACES_EXPORTER=none
            OTEL_METRICS_EXPORTER=none
            OTEL_LOGS_EXPORTER=none

      # Run without --settings=backend.ci_settings — see LIGHTHOUSE_README.md § CI design decisions.
      - name: Run migrations (Postgres)
        run: |
          docker compose exec backend sh -c "
            python manage.py makemigrations --noinput &&
            python manage.py makemigrations --merge --noinput &&
            python manage.py migrate --noinput
          "

      # Plans (Free/Team) are seeded by migration 0004_seed_token_plans during the
      # migrate step above; initialize_default_plans() was removed in the SMP-560
      # token-billing redesign, so the old explicit seed step is gone.

      - name: Verify backend is ready
        run: |
          for i in $(seq 1 30); do
            if docker compose --profile ci exec -T backend python manage.py shell -c "from django.contrib.auth.models import User; print('DB OK')" > /dev/null 2>&1; then
              echo "Backend ready."
              exit 0
            fi
            sleep 2
          done
          docker compose --profile ci logs backend --tail 100
          exit 1

      - name: Wait for app on localhost
        run: |
          for i in $(seq 1 90); do
            if curl -fsS --max-time 5 http://localhost/ > /dev/null 2>&1; then
              echo "OK"
              exit 0
            fi
            sleep 2
          done
          docker compose --profile ci logs nginx --tail 80 || true
          docker compose --profile ci logs frontend --tail 80 || true
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and run Lighthouse
        working-directory: frontend
        env:
          LHCI_AUTH_EMAIL: ${{ secrets.LHCI_AUTH_EMAIL }}
          LHCI_AUTH_PASSWORD: ${{ secrets.LHCI_AUTH_PASSWORD }}
          CI: true
        run: |
          npm ci
          npm run lighthouse:local

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports-${{ github.sha }}
          path: frontend/.lighthouseci/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Docker compose logs (on failure)
        if: failure()
        run: |
          docker compose --profile ci ps -a || true
          docker compose --profile ci logs backend --tail 250 || true
          docker compose --profile ci logs nginx --tail 120 || true

      # Cleanup containers and volumes
      - name: Cleanup containers
        if: always()
        run: |
          echo "Cleaning up containers and volumes..."
          # A prior step may have failed before the ".env" file was created.
          # docker compose still needs it to resolve the "env_file" directive,
          # and this cleanup must never fail the job, so guard both.
          [ -f .env ] || touch .env
          docker compose --profile ci --env-file .env down -v || true
          echo "Cleaning up unused Docker resources..."
          docker system prune -f || true

  # Keeps the application_test check name and the deploy/notify gates working
  # now that the tests run as separate parallel jobs.
  application_test:
    needs: [build_images, backend_tests, backend_coverage, backend_serial_tests, frontend_tests, studio_tests, budget_e2e]
    if: ${{ !cancelled() && needs.build_images.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check application test jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result != "success")' > /dev/null; then
            echo "One or more application test jobs did not succeed."
            exit 1
          fi

  deploy:
    needs: [block, migration_guard, code_scan, image_scan, application_test]
    if: needs.block.result == 'success' && needs.migration_guard.result == 'success' && needs.code_scan.result == 'success' && needs.image_scan.result == 'success' && needs.application_test.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy (main)
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.MEDIAJIRA_DEPLOY_WEBHOOK_URL_MAIN }}
          DEPLOY_TOKEN: ${{ secrets.MEDIAJIRA_DEPLOY_TOKEN }}
        run: |
          curl -fsSL -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            -d '{"action": "deploy", "source": "github"}'

      - name: Verify production health after deploy
        env:
          PRODUCTION_HEALTH_URL: ${{ vars.MEDIAJIRA_PRODUCTION_HEALTH_URL || 'https://zmarkio.com' }}
          HEALTH_CHECK_ATTEMPTS: ${{ vars.MEDIAJIRA_HEALTH_CHECK_ATTEMPTS || '45' }}
          HEALTH_CHECK_INTERVAL: ${{ vars.MEDIAJIRA_HEALTH_CHECK_INTERVAL || '20' }}
        run: |
          echo "Verifying production health at $PRODUCTION_HEALTH_URL (up to $HEALTH_CHECK_ATTEMPTS attempts, ${HEALTH_CHECK_INTERVAL}s apart)"

          for attempt in $(seq 1 "$HEALTH_CHECK_ATTEMPTS"); do
            status_code=$(curl -sS -L -o /tmp/mediajira-health.html -w "%{http_code}" --max-time 20 "$PRODUCTION_HEALTH_URL" || true)
            status_code=${status_code:-000}

            if [ "$status_code" -ge 200 ] && [ "$status_code" -lt 400 ]; then
              echo "Production health check passed with HTTP $status_code on attempt $attempt."
              exit 0
            fi

            echo "Production health check attempt $attempt/$HEALTH_CHECK_ATTEMPTS failed with HTTP $status_code."
            if grep -qi "error code 521\|web server is down" /tmp/mediajira-health.html 2>/dev/null; then
              echo "Cloudflare 521 / Web server is down response detected."
            fi

            if [ "$attempt" -lt "$HEALTH_CHECK_ATTEMPTS" ]; then
              sleep "$HEALTH_CHECK_INTERVAL"
            fi
          done

          echo "Production health check failed after $HEALTH_CHECK_ATTEMPTS attempts."
          exit 1

      # - name: Trigger deploy (prod-preview)
      #   if: github.ref == 'refs/heads/prod-preview'
      #   env:
      #     DEPLOY_WEBHOOK_URL: ${{ secrets.MEDIAJIRA_DEPLOY_WEBHOOK_URL_PREVIEW }}
      #   run: |
      #     curl -fsSL -X POST "$DEPLOY_WEBHOOK_URL" \
      #       -H "Content-Type: application/json" \
      #       -d '{"action": "deploy", "source": "github"}'
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: ap-southeast-2 
      # - name: Trigger CodeDeploy
      #   run: |
      #     ${{ secrets.AWS_BLUE_GREEN_DEPLOYMENT_CMD }}

      # - name: Trigger deploy (preview)
      #   if: github.ref == 'refs/heads/prod-preview'
      #   env:
      #     DEPLOY_WEBHOOK_URL: ${{ secrets.MEDIAJIRA_DEPLOY_WEBHOOK_URL_PREVIEW }}
      #   run: |
      #     curl -fsSL -X POST "$DEPLOY_WEBHOOK_URL" \
      #       -H "Content-Type: application/json" \
      #       -d '{"action": "deploy", "source": "github"}'

  sbom_release:
    needs: block
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SBOM tools
        run: |
          pip install cyclonedx-bom
          npm install -g @cyclonedx/cyclonedx-npm

      - name: Generate backend and frontend SBOMs
        run: |
          mkdir -p sbom
          cyclonedx-py requirements \
            backend/requirements.txt \
            --output-format JSON \
            --validate \
            -o sbom/mediajira-backend-python-${{ github.ref_name }}.cdx.json
          cyclonedx-npm \
            --package-lock-only \
            --output-format JSON \
            --validate \
            --output-file sbom/mediajira-frontend-npm-${{ github.ref_name }}.cdx.json \
            frontend/package.json

      - name: Validate SBOM format
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("sbom").glob("*.cdx.json")):
              with path.open() as f:
                  data = json.load(f)
              assert data.get("bomFormat") == "CycloneDX", f"{path}: missing CycloneDX bomFormat"
              assert data.get("specVersion"), f"{path}: missing specVersion"
              assert isinstance(data.get("components", []), list), f"{path}: components must be a list"
              print(f"validated {path}")
          PY

      - name: Upload SBOM workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediajira-sboms-${{ github.ref_name }}
          path: sbom/*.cdx.json

      - name: Publish SBOMs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sbom/*.cdx.json

  notify:
    needs: [block, migration_guard, code_scan, image_scan, application_test, deploy, sbom_release]
    runs-on: ubuntu-latest
    if: always() && github.ref != 'refs/heads/feature/MED-447'
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.MEDIAJIRA_DISCORD_WEBHOOK_URL }}
        run: |
          BLOCK="${{ needs.block.result }}"
          MIGRATION_GUARD="${{ needs.migration_guard.result }}"
          CODE_SCAN="${{ needs.code_scan.result }}"
          IMAGE_SCAN="${{ needs.image_scan.result }}"
          APPLICATION_TEST="${{ needs.application_test.result }}"
          DEPLOY="${{ needs.deploy.result }}"
          SBOM_RELEASE="${{ needs.sbom_release.result }}"
          
          # Determine overall status based on all job results
          OVERALL_STATUS="success"
          if [ "$BLOCK" == "failure" ] || [ "$MIGRATION_GUARD" == "failure" ] || [ "$CODE_SCAN" == "failure" ] || [ "$IMAGE_SCAN" == "failure" ] || [ "$APPLICATION_TEST" == "failure" ] || [ "$DEPLOY" == "failure" ] || [ "$SBOM_RELEASE" == "failure" ]; then
            OVERALL_STATUS="failure"
          fi
          
          MESSAGE="Workflow *${{ github.workflow }}* finished on branch *${{ github.ref_name }}*\n"
          MESSAGE+="Block: **$BLOCK**\n"
          MESSAGE+="Migration guard: **$MIGRATION_GUARD**\n"
          MESSAGE+="Code scan: **$CODE_SCAN**\n"
          MESSAGE+="Image scan: **$IMAGE_SCAN**\n"
          MESSAGE+="Application test: **$APPLICATION_TEST**\n"
          MESSAGE+="Deploy: **$DEPLOY**\n"
          MESSAGE+="SBOM release: **$SBOM_RELEASE**\n"
          MESSAGE+="Overall status: **$OVERALL_STATUS**\n"
          MESSAGE+="Commit: ${{ github.sha }}\n"
          MESSAGE+="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsSL -H "Content-Type: application/json" -X POST -d "{\"content\": \"$MESSAGE\"}" "$DISCORD_WEBHOOK_URL"
          
          # Exit with failure if overall status is failure
          if [ "$OVERALL_STATUS" == "failure" ]; then
            exit 1
          fi
