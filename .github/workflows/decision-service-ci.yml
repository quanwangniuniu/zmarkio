name: Decision Service CI

on:
  push:
    branches: [main, prod-preview]
    paths:
      - 'services/decision-service/**'
      - '.github/workflows/decision-service-ci.yml'
  pull_request:
    branches: [main, prod-preview]
    paths:
      - 'services/decision-service/**'
      - '.github/workflows/decision-service-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and test
        run: dotnet test services/decision-service/tests/DecisionService.Tests --configuration Release