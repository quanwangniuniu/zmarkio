name: Decision Service CI

on:
  push:
    branches: [main, prod-preview]
    paths:
      - 'services/decision-service/**'
      - '.github/workflows/decision-service-ci.yml'
  pull_request:
    branches: [main, prod-preview]
    paths:
      - 'services/decision-service/**'
      - '.github/workflows/decision-service-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'

      - name: Build Docker image
        run: docker build -t decision-service:ci services/decision-service

      - name: Build and test
        run: dotnet test services/decision-service/tests/DecisionService.Tests --configuration Release